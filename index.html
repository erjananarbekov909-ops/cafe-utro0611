<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кафе Утро — вкусные завтраки</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header" id="home">
        <div class="container header__inner">
            <a class="logo" href="#home">
                <img class="logo__image" src="images/logo.png" alt="">
                <span>Кафе Утро</span>
            </a>

            <nav class="nav">
                <a class="nav__link nav__link--active" href="#home">Главная</a>
                <a class="nav__link" href="#Меню">Меню</a>
                <a class="nav__link" href="#О нас">О нас</a>
                <a class="nav__link" href="#Контакты">Контакты</a>
            </nav>

            <a class="button button--small" href="#booking">
                Забронировать стол
            </a>
        </div>
    </header>

    <main>
        <div class="hero" id="menu">
            <div class="container hero__inner">
                <div class="hero__text">
                    <h1>Вкусные<br>завтраки каждый<br>день</h1>

                    <p>
                        Ароматный кофе, свежая выпечка<br class="desktop-break">
                        и уютная атмосфера.
                    </p>

                    <a class="button" href="#booking">
                        Забронировать стол
                    </a>
                </div>
                <div class="hero__image"></div>
            </div>
        </div>

        <div class="container features" id="about">
            <div class="feature">
                <img class="feature__icon" src="images/coffee.png" alt="">

                <div>
                    <h2>Свежий кофе</h2>
                    <p>Лучшие зерна<br>каждый день.</p>
                </div>
            </div>

            <div class="feature">
                <img class="feature__icon" src="images/croissant.png" alt="">

                <div>
                    <h2>Свежая выпечка</h2>
                    <p>Ароматные круассаны<br>и десерты.</p>
                </div>
            </div>

            <div class="feature" id="contacts">
                <img class="feature__icon" src="images/place.png" alt="">

                <div>
                    <h2>Уютное место</h2>
                    <p>Идеально для работы<br>и встреч.</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
